function levelSVG(worldIdx,levelIdx){

  const placed=[];
  for(let i=0;i<n;i++){
    let ox,oy,ok=false,tries=0;
    do{ ox=60+r()*480; oy=80+r()*330; tries++;
      ok=placed.every(p=>Math.abs(p.x-ox)>95||Math.abs(p.y-oy)>80);
    }while(!ok&&tries<25);
    placed.push({x:ox,y:oy});

}

  g.gain.value=.22;s.connect(f).connect(g).connect(a.destination);s.start(t);}
function fanfare(){
  [[523,0],[659,.12],[784,.24],[1046,.38],[1318,.55],[1046,.7],[1568,.9]].forEach(([f,w])=>{tone(f,.4,'triangle',.24,w);tone(f/2,.4,'sine',.1,w);});
  tone(60,.9,'sawtooth',.14,0,240); tone(120,.7,'square',.06,.15,500);
}
const MELODY=[523,0,659,0,784,659,0,880,784,0,659,0,523,587,659,0,523,0,659,0,784,880,0,1046,880,784,659,587,523,0,587,0];
let musicIdx=0;
setInterval(()=>{if(!soundOn)return;const n=MELODY[musicIdx%MELODY.length];
  if(n){tone(n,.2,'triangle',.06);if(musicIdx%8===0)tone(n/4,.45,'sine',.07);}musicIdx++;},190);
const paletteEl=document.getElementById('palette');
function buildPalette(){
  paletteEl.innerHTML='';
  COLORS.forEach(c=>{const s=document.createElement('div');s.className='swatch';s.style.background=c;
    s.onclick=()=>{currentColor=c;selectSwatch(s);popSound();};paletteEl.appendChild(s);});
  const m=document.createElement('div');m.className='swatch magic';m.title='Magic Rainbow!';
  m.onclick=()=>{currentColor=MAGIC;selectSwatch(m);magicSound();rippleAt(innerWidth/2,innerHeight/2);};
  paletteEl.appendChild(m);
  selectSwatch(paletteEl.children[5]);
}
function selectSwatch(el){paletteEl.querySelectorAll('.swatch').forEach(x=>x.classList.remove('selected'));el.classList.add('selected');}
let curWorld=0;
const tabsEl=document.getElementById('worldTabs'),gridEl=document.getElementById('levelGrid');
function buildTabs(){
  tabsEl.innerHTML='';
  WORLDS.forEach((w,i)=>{
    const t=document.createElement('button');t.className='worldTab'+(i===curWorld?' sel':'');
    t.textContent=w.emoji+' '+w.name;
    t.onclick=()=>{curWorld=i;buildTabs();buildGrid();swoosh();};
    tabsEl.appendChild(t);
  });
}
function buildGrid(){
  gridEl.innerHTML='';
  const unlocked=unlockedCount();
  for(let j=0;j<LEVELS_PER_WORLD;j++){
    const idx=curWorld*LEVELS_PER_WORLD+j;
    const card=document.createElement('div');
    card.className='levelCard'+(idx>=unlocked?' locked':'')+(save.stars[idx]===3?' perfect':'');
    const st=save.stars[idx];
    card.innerHTML='<div class="num">'+(idx+1)+'</div><div class="stars">'+'★'.repeat(st)+'☆'.repeat(3-st)+'</div>'+(idx>=unlocked?'<div class="lock">🔒</div>':'');
    card.onclick=()=>{
      if(idx>=unlocked){tone(160,.25,'square',.18);return;}
      startLevel(idx);
    };
    gridEl.appendChild(card);
  }
}
const board=document.getElementById('board'),statusEl=document.getElementById('status'),
      progressBar=document.getElementById('progressBar'),comboEl=document.getElementById('combo');
function showScreen(id){document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));document.getElementById(id).classList.add('active');}
function startLevel(i){
  currentLevel=i;usedColors.clear();filledCount=0;comboN=0;comboEl.textContent='';
  const wi=Math.floor(i/LEVELS_PER_WORLD), li=i%LEVELS_PER_WORLD, w=WORLDS[wi];
  document.documentElement.style.setProperty('--bg1',w.bg[0]);
  document.documentElement.style.setProperty('--bg2',w.bg[1]);
  document.documentElement.style.setProperty('--bg3',w.bg[2]);
  board.innerHTML=levelSVG(wi,li);
  totalShapes=board.querySelectorAll('.fillable').length;
  board.style.animation='none';void board.offsetWidth;board.style.animation='';
  board.querySelectorAll('.fillable').forEach((el,idx)=>{
    el.style.animationDelay=(idx*35)+'ms';
    el.addEventListener('click',e=>fillShape(el,e));
  });
  statusEl.textContent='Level '+(i+1)+' — '+w.name+'! Tap a shape 🖌️';
  updateProgress(); swoosh(); showScreen('gameScreen');
}
function fillShape(el,e){
  const r=board.getBoundingClientRect(), x=e.clientX-r.left, y=e.clientY-r.top;
  el.style.fill=currentColor===MAGIC?'url(#rainbow)':currentColor;
  el.classList.remove('pop');void el.getBoundingClientRect();el.classList.add('pop');
  if(currentColor!==MAGIC)usedColors.add(currentColor);
  filledCount++;
  comboN++;clearTimeout(comboTimer);comboTimer=setTimeout(()=>{comboN=0;comboEl.textContent='';},1400);
  comboEl.textContent=comboN>1?'🔥x'+comboN:'';
  comboEl.classList.toggle('hot',comboN>=5);
  if(comboN===10){statusEl.textContent='🔥 ON FIRE! Keep tapping! 🔥';tone(1046,.25,'square',.1);}
  if(currentColor===MAGIC){magicSound();bigBurst(x,y,28);}
  else{popSound();burst(x,y,12+(comboN>3?6:0));}
  rippleAt(e.clientX,e.clientY);
  floatText(x,y,comboN>1?'+'+comboN:'✓',currentColor===MAGIC?'#a55eea':currentColor);
  if(comboN>0&&comboN%15===0){document.body.classList.add('shake');setTimeout(()=>document.body.classList.remove('shake'),450);}
  updateProgress();
  if(filledCount===totalShapes)setTimeout(levelComplete,550);
}
function updateProgress(){
  progressBar.style.width=(filledCount/totalShapes*100)+'%';
  if(filledCount<totalShapes)statusEl.textContent=filledCount+' / '+totalShapes+' shapes — keep going! 🎨';
}
const overlay=document.getElementById('completeOverlay');
function levelComplete(){
  const distinct=usedColors.size, stars=distinct>=6?3:distinct>=3?2:1;
  if(stars>save.stars[currentLevel]){save.stars[currentLevel]=stars;persist();}
  const last=currentLevel===TOTAL-1;
  document.getElementById('completeTitle').textContent=last?'🏆 ALL 108 LEVELS DONE! COLOR LEGEND! 🏆':'🌟 LEVEL COMPLETE! 🌟';
  document.getElementById('completeMsg').textContent=distinct+' colors used on '+WORLDS[Math.floor(currentLevel/LEVELS_PER_WORLD)].name+' level '+(currentLevel+1)+'!';
  document.getElementById('bigStars').innerHTML=[0,1,2].map(i=>'<span style="animation-delay:'+(i*.22)+'s">'+(i<stars?'⭐':'<span style="opacity:.25">⭐</span>')+'</span>').join('');
  document.getElementById('nextBtn').style.display=currentLevel<TOTAL-1?'':'none';
  overlay.classList.add('show');
  fanfare();confetti(160);fireworks(last?12:7);
  document.body.classList.add('shake');setTimeout(()=>document.body.classList.remove('shake'),450);
}
document.getElementById('nextBtn').onclick=()=>{overlay.classList.remove('show');startLevel(Math.min(currentLevel+1,TOTAL-1));};
document.getElementById('replayBtn').onclick=()=>{overlay.classList.remove('show');startLevel(currentLevel);};
document.getElementById('backBtn').onclick=()=>{overlay.classList.remove('show');buildTabs();buildGrid();showScreen('menuScreen');swoosh();};
function burst(x,y,n){
  for(let i=0;i<n;i++){
    const p=document.createElement('div');p.className='sparkle';
    const col=currentColor===MAGIC?COLORS[(Math.random()*COLORS.length)|0]:currentColor;
    const size=4+Math.random()*10;
    p.style.cssText='left:'+x+'px;top:'+y+'px;width:'+size+'px;height:'+size+'px;background:'+col+';box-shadow:0 0 10px '+col+';';
    p.style.setProperty('--dx',(Math.random()-.5)*170+'px');
    p.style.setProperty('--dy',(Math.random()-.5)*170+'px');
    p.style.animation='spark '+(.5+Math.random()*.45)+'s ease-out forwards';
    board.appendChild(p);setTimeout(()=>p.remove(),1000);
  }
  const emojis=['✨','⭐','💫','🌈','🎉','💖'];
  for(let i=0;i<4;i++){
    const s=document.createElement('div');s.className='starfx';
    s.textContent=emojis[(Math.random()*emojis.length)|0];
    s.style.left=x+'px';s.style.top=y+'px';
    s.style.setProperty('--dx',(Math.random()-.5)*230+'px');
    s.style.setProperty('--dy',(Math.random()-.5)*230+'px');
    s.style.animation='starFly '+(.7+Math.random()*.4)+'s ease-out forwards';
    board.appendChild(s);setTimeout(()=>s.remove(),1200);
  }
}
function bigBurst(x,y,n){burst(x,y,n);setTimeout(()=>burst(x,y,(n/2)|0),120);}
function rippleAt(cx,cy){
  const w=document.createElement('div');w.className='ripple';
  w.style.left=(cx-115)+'px';w.style.top=(cy-115)+'px';
  w.style.borderColor=currentColor===MAGIC?'#fff':currentColor;
  document.body.appendChild(w);setTimeout(()=>w.remove(),700);
}
function floatText(x,y,txt,color){
  const t=document.createElement('div');t.className='floatTxt';t.textContent=txt;
  t.style.left=(x-20)+'px';t.style.top=(y-30)+'px';t.style.color=color;
  board.appendChild(t);setTimeout(()=>t.remove(),950);
}
function confetti(n){
  for(let i=0;i<n;i++){
    const p=document.createElement('div');p.className='confetti-piece';
    const c=COLORS[(Math.random()*COLORS.length)|0];
    p.style.cssText='left:'+(Math.random()*100)+'vw;width:'+(6+Math.random()*8)+'px;height:'+(10+Math.random()*10)+'px;background:'+c+';';
    p.style.animation='fall '+(2.2+Math.random()*2.6)+'s linear '+(Math.random()*1.4)+'s forwards';
    document.body.appendChild(p);setTimeout(()=>p.remove(),7000);
  }
}
function fireworks(n){
  for(let i=0;i<n;i++)setTimeout(()=>{
    const x=innerWidth*(.12+Math.random()*.76),y=innerHeight*(.12+Math.random()*.5);
    tone(500+Math.random()*700,.35,'sine',.13,0,90);
    for(let j=0;j<26;j++){
      const p=document.createElement('div');p.className='confetti-piece';
      const c=COLORS[(Math.random()*COLORS.length)|0],size=5+Math.random()*7;
      p.style.cssText='left:'+x+'px;top:'+y+'px;width:'+size+'px;height:'+size+'px;border-radius:50%;background:'+c+';position:fixed;box-shadow:0 0 8px '+c+';';
      const ang=Math.PI*2*j/26,dist=90+Math.random()*170;
      p.style.setProperty('--dx',Math.cos(ang)*dist+'px');
      p.style.setProperty('--dy',Math.sin(ang)*dist+'px');
      p.style.animation='spark '+(.8+Math.random()*.5)+'s ease-out forwards';
      document.body.appendChild(p);setTimeout(()=>p.remove(),1400);
    }
  },i*330);
}
let lastTrail=0;
addEventListener('mousemove',e=>{
  const now=performance.now();if(now-lastTrail<32)return;lastTrail=now;
  const t=document.createElement('div');t.className='trail';
  const c=COLORS[(Math.random()*COLORS.length)|0],size=6+Math.random()*11;
  t.style.cssText='left:'+(e.clientX-size/2)+'px;top:'+(e.clientY-size/2)+'px;width:'+size+'px;height:'+size+'px;background:'+c+';box-shadow:0 0 12px '+c+';';
  document.body.appendChild(t);setTimeout(()=>t.remove(),850);
});
for(let i=0;i<26;i++){
  const s=document.createElement('div');s.className='twinkle';s.textContent='✦';
  s.style.left=Math.random()*100+'vw';s.style.top=Math.random()*100+'vh';
  s.style.fontSize=(8+Math.random()*14)+'px';s.style.animationDelay=(Math.random()*3)+'s';
  document.body.appendChild(s);
}
document.getElementById('menuBtn').onclick=()=>{buildTabs();buildGrid();showScreen('menuScreen');swoosh();};
document.getElementById('resetBtn').onclick=()=>startLevel(currentLevel);
document.getElementById('soundBtn').onclick=e=>{soundOn=!soundOn;e.target.textContent=soundOn?'🔊':'🔇';if(soundOn)popSound();};
buildPalette();buildTabs();buildGrid();
document.addEventListener('pointerdown',()=>{if(soundOn)ac();},{once:true});
</script>
</body>
</html>
